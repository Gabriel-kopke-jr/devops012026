---
- hosts: db
  become: yes
  tasks:
    - name: 'Instalação de pacotes BD'
      apt:
        pkg:
          - mariadb-server
          - wget
          - zip
          - curl
          - vim
          - python3-mysqldb
        state: present
        update_cache: yes
    - name: 'Criando DB backup'
      mysql_db:
       name: backup
       state: present
       login_unix_socket: /run/mysqld/mysqld.sock   
    - name: 'Criação do usuario express'
      mysql_user:
        host: '%'
        name: express
        password: 'LinuxForce01'
        priv: 'backup.*:ALL'
        state: present
        login_unix_socket: /run/mysqld/mysqld.sock
    - name: 'Substituir bind do mysql'
      replace: 
        path: /etc/mysql/mariadb.conf.d/50-server.cnf
        regexp: '127\.0\.0\.1'
        replace: '0.0.0.0'
      notify: RestartMysql

  handlers:
    - name: RestartMysql
      service:
        name: mysql
        state: restarted
        enabled: yes

